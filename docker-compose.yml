services:
  db:
    image: postgres:16-alpine
    container_name: pipely-db
    # Dev credentials come from backend/.env; the :- defaults keep
    # `docker compose up` working out of the box.
    environment:
      POSTGRES_DB: ${DB_NAME:-pipely}
      POSTGRES_USER: ${DB_USER:-pipely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pipely}
    ports:
      # Host 5435 -> container 5432 (5432/5433/5434 are used by other projects).
      - "5435:5432"
    volumes:
      - pipely_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pipely} -d ${DB_NAME:-pipely}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pipely-backend
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the app reaches Postgres at db:5432,
      # overriding the host-oriented values from backend/.env.
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pipely-frontend
    ports:
      # Host 5173 -> nginx :80 serving the built SPA.
      - "5173:80"
    depends_on:
      - backend

volumes:
  pipely_pgdata:
